[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieval-observatory"
version = "0.3.3"
description = "Local-first retrieval reliability platform: benchmarks, Forge stress tests, TraceLens observability, and Advisor regressions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ameya Kiwalkar", email = "akiwalkar@berkeley.edu" }]
keywords = ["rag", "retrieval", "benchmark", "evaluation", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "rich>=13.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.urls]
PyPI = "https://pypi.org/project/retrieval-observatory/"
Homepage = "https://github.com/AmeyaKI/retrieval-observatory"
Documentation = "https://github.com/AmeyaKI/retrieval-observatory#readme"
Repository = "https://github.com/AmeyaKI/retrieval-observatory"
Issues = "https://github.com/AmeyaKI/retrieval-observatory/issues"
Changelog = "https://github.com/AmeyaKI/retrieval-observatory/releases"

[project.optional-dependencies]
beir = ["datasets>=2.0", "beir>=2.0"]
cohere = ["cohere>=5.0"]
hf = ["sentence-transformers>=3.0", "torch"]
dense = ["sentence-transformers>=3.0", "faiss-cpu>=1.7", "torch"]
langchain = ["langchain-core>=0.2"]
llamaindex = ["llama-index-core>=0.10"]
pgvector = ["asyncpg>=0.29", "pgvector>=0.3"]
postgres = ["asyncpg>=0.29"]
dashboard = ["fastapi>=0.111", "uvicorn>=0.29", "python-multipart>=0.0.9"]
llm-judge = ["google-generativeai>=0.8", "anthropic>=0.28", "openai>=1.0"]
demo = ["beir>=2.0", "datasets>=2.0", "rank-bm25>=0.2.2"]
classifier = ["scikit-learn>=1.4", "joblib>=1.3"]
forge = ["google-generativeai>=0.8", "anthropic>=0.28", "openai>=1.0"]
# TraceLens: difficulty enrichment reuses the classifier; HTTPSink reuses httpx; stats use numpy.
# No new heavy deps. httpx is only needed for the remote-push sink.
tracelens = ["scikit-learn>=1.4", "joblib>=1.3", "httpx>=0.27"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "coverage", "respx>=0.21", "scikit-learn>=1.4", "joblib>=1.3"]

[project.scripts]
retobs = "retrieval_observatory.cli:app"

[project.entry-points.pytest11]
retobs = "retrieval_observatory.pytest_plugin"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["retrieval_observatory*"]

[tool.setuptools.package-data]
retrieval_observatory = [
    "dashboard/ui/dist/**/*",
    "examples/**/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Avoid pytest-rerunfailures (often auto-loaded in Conda) — it can segfault with numpy on macOS.
addopts = "-p no:rerunfailures"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["retrieval_observatory"]
