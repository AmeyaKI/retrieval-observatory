[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieval-observatory"
version = "0.1.0"
description = "Framework-agnostic benchmarking for hybrid RAG retrieval pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ email = "akiwalkar@berkeley.edu" }]
keywords = ["rag", "retrieval", "benchmark", "evaluation", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "rich>=13.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
beir = ["datasets>=2.0", "beir>=2.0"]
cohere = ["cohere>=5.0"]
hf = ["sentence-transformers>=3.0", "torch"]
dense = ["sentence-transformers>=3.0", "faiss-cpu>=1.7", "torch"]
langchain = ["langchain-core>=0.2"]
llamaindex = ["llama-index-core>=0.10"]
pgvector = ["asyncpg>=0.29", "pgvector>=0.3"]
postgres = ["asyncpg>=0.29"]
dashboard = ["fastapi>=0.111", "uvicorn>=0.29"]
llm-judge = ["google-generativeai>=0.8", "anthropic>=0.28", "openai>=1.0"]
demo = ["beir>=2.0", "datasets>=2.0", "rank-bm25>=0.2.2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "coverage", "respx>=0.21"]

[project.scripts]
retobs = "retrieval_observatory.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["retrieval_observatory*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["retrieval_observatory"]
