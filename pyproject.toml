[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieval-observatory"
version = "0.5.6"
description = "Local-first retrieval reliability: integrate, evaluate, compare under release policy, and inspect candidate lineage"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ameya Kiwalkar", email = "akiwalkar@berkeley.edu" }]
keywords = ["rag", "retrieval", "evaluation", "diagnostics", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "rich>=13.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.urls]
PyPI = "https://pypi.org/project/retrieval-observatory/"
Homepage = "https://github.com/AmeyaKI/retrieval-observatory"
Documentation = "https://github.com/AmeyaKI/retrieval-observatory#readme"
Repository = "https://github.com/AmeyaKI/retrieval-observatory"
Issues = "https://github.com/AmeyaKI/retrieval-observatory/issues"
Changelog = "https://github.com/AmeyaKI/retrieval-observatory/releases"

[project.optional-dependencies]
beir = ["datasets>=2.0", "beir>=2.0"]
cohere = ["cohere>=5.0"]
hf = ["sentence-transformers>=3.0", "torch"]
dense = ["sentence-transformers>=3.0", "faiss-cpu>=1.7", "torch"]
langchain = ["langchain-core>=0.2"]
llamaindex = ["llama-index-core>=0.10"]
# Haystack/DSPy/OpenAI-Agents adapters (tracing/integrations/{haystack,dspy,openai_agents}.py)
# are duck-typed -- they never import these packages, so they're unit-testable without any
# of these extras installed. The extras exist purely so users following the integration
# snippets (integrations/registry.py) can `pip install retrieval-observatory[haystack]` etc.
haystack = ["haystack-ai>=2.0"]
dspy = ["dspy-ai>=2.4"]
openai-agents = ["openai-agents>=0.0.3"]
pgvector = ["asyncpg>=0.29", "pgvector>=0.3"]
postgres = ["asyncpg>=0.29"]
dashboard = ["fastapi>=0.111", "uvicorn>=0.29", "python-multipart>=0.0.9"]
serve = ["fastapi>=0.111", "uvicorn>=0.29", "python-multipart>=0.0.9"]
qdrant = ["qdrant-client>=1.9"]
llm-judge = ["google-generativeai>=0.8", "anthropic>=0.28", "openai>=1.0"]
demo = ["beir>=2.0", "datasets>=2.0", "rank-bm25>=0.2.2"]
classifier = ["scikit-learn>=1.4", "joblib>=1.3"]
# Production tracing enrichment reuses the classifier; HTTP export reuses httpx; statistics use numpy.
# MCP server for agent integration. Wraps the SDK/REST layer; requires the dashboard extra at
# runtime for the shared helpers, but the `mcp` package itself is the only net-new dependency.
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "coverage", "respx>=0.21", "scikit-learn>=1.4", "joblib>=1.3", "ruff>=0.6", "types-PyYAML", "mcp>=1.2", "fastapi>=0.111", "playwright>=1.45"]

[project.scripts]
retobs = "retrieval_observatory.cli:app"

[project.entry-points.pytest11]
retobs = "retrieval_observatory.pytest_plugin"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["retrieval_observatory*"]

[tool.setuptools.package-data]
retrieval_observatory = [
    "dashboard/ui/dist/**/*",
    "examples/**/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Avoid externally auto-loaded plugins (often injected by global Conda envs) that destabilize test runs.
addopts = "-p no:rerunfailures -p no:seleniumbase -p no:xdist -p no:langsmith -p no:html"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "browser: requires RETOBS_E2E_URL and a Playwright browser",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# F = pyflakes (unused imports/vars, f-string issues); E/W = pycodestyle essentials.
# E501 (line length) is intentionally not enforced to avoid churn on existing code.
select = ["E", "F", "W"]
# E402 (import-not-at-top): files use deferred/conditional imports by design.
# E702 (semicolon): terse one-liners in tests. E501/E203: line-length churn.
ignore = ["E501", "E203", "E402", "E702"]

[tool.coverage.run]
source = ["retrieval_observatory"]
