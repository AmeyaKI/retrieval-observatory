# BEIR publish full sweep — NFCorpus (323 test queries, 4 pipelines)
# Canonical config for publication sweeps. Reproduce: ./scripts/run_beir_publish.sh full-sweep
# See also: examples/beir_publish/sweep_nfcorpus.yaml (same content)

experiment:
  name: beir-publish-sweep-nfcorpus

dataset:
  name: beir/nfcorpus   # Biomedical nutrition claims; sparse relevance labels
  split: test           # Full test split (323 queries, 3,633 docs)

# Named stages for combination expansion. ablations: true auto-runs [bm25] prefix.
stages:
  bm25:
    type: adapter.bm25
    config:
      k: 100            # Top-100 candidates passed to reranker
  rerank:
    type: adapter.hf_crossencoder
    config:
      model: cross-encoder/ms-marco-MiniLM-L-6-v2
      k: 10             # Final top-10 after reranking
      batch_size: 32

combinations:
  include:
    - [bm25, rerank]    # Produces bm25__rerank; ablations adds bm25 alone
  ablations: true       # Prefix pair bm25 → bm25__rerank for stage attribution only

# Independent pipelines (not an ablation chain — all four run in parallel)
pipelines:
  - id: dense_only
    stages:
      - type: adapter.hf_biencoder
        config:
          model: sentence-transformers/all-MiniLM-L6-v2
          k: 100
          batch_size: 64

  - id: rrf_hybrid
    stages:
      - type: adapter.rrf
        config:
          rrf_k: 60
          fetch_k: 100
          top_k: 100
          retrievers:
            - type: adapter.bm25
            - type: adapter.hf_biencoder
              config:
                model: sentence-transformers/all-MiniLM-L6-v2

metrics:
  recall_at_k: [1, 5, 10]
  ndcg_at_k: [10]
  mrr: true
  map: true
  latency_percentiles: [50, 95]

execution:
  concurrency: 1
  timeout_seconds: 300
  cache_results: true   # Stage cache keyed by config+query; use --no-cache for audit reruns

output:
  store: sqlite
  db_path: .retobs/publish_sweep_nfcorpus.db
  export: [json]
