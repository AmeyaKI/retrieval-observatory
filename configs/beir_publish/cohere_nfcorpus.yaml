# BEIR publish — BM25 vs BM25+Cohere rerank (full NFCorpus, 323 queries)
# Requires COHERE_API_KEY in environment or .env file.
# Reproduce: ./scripts/run_beir_publish.sh cohere-nfcorpus
# Note: publication run had 155/323 queries complete (API rate limits); rerun with --no-cache.

experiment:
  name: beir-publish-cohere-nfcorpus

dataset:
  name: beir/nfcorpus
  split: test

stages:
  bm25:
    type: adapter.bm25
    config:
      k: 100
  cohere_rerank:
    type: adapter.cohere_rerank
    config:
      model: rerank-english-v3.0
      k: 10

combinations:
  include:
    - [bm25, cohere_rerank]
  ablations: true       # Also runs bm25 baseline for comparison

metrics:
  recall_at_k: [1, 5, 10]
  ndcg_at_k: [10]
  mrr: true
  map: true
  latency_percentiles: [50, 95]

execution:
  concurrency: 1
  timeout_seconds: 120
  cache_results: true

output:
  store: sqlite
  db_path: .retobs/publish_cohere_nfcorpus.db
  export: [json]
