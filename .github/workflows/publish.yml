name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-candidate:
    uses: ./.github/workflows/release-candidate.yml

  publish-testpypi:
    needs: release-candidate
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: release-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tested release digest and tag
        run: |
          python release-evidence/verify_release_artifact.py --dist dist --manifest release-evidence/artifact-manifest.json
          WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          VERSION=$(python -c "import email, zipfile; z=zipfile.ZipFile('${WHEEL}'); m=[n for n in z.namelist() if n.endswith('.dist-info/METADATA')][0]; print(email.message_from_bytes(z.read(m))['Version'])")
          if [ "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]; then
            echo "Tag ${GITHUB_REF#refs/tags/v} does not match tested wheel version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Verify TestPyPI trusted publisher package name
        run: |
          WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          PACKAGE=$(python -c "import email, zipfile; z=zipfile.ZipFile('${WHEEL}'); m=[n for n in z.namelist() if n.endswith('.dist-info/METADATA')][0]; print(email.message_from_bytes(z.read(m))['Name'])")
          test "$PACKAGE" = "retrieval-observatory"
      - name: Stage PyPI packages only
        run: |
          mkdir -p packages
          cp dist/*.whl dist/*.tar.gz packages/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: packages/
          skip-existing: true
      - name: Smoke the exact uploaded TestPyPI version
        run: |
          WHEEL=$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)
          python -m venv /tmp/testpypi-smoke
          /tmp/testpypi-smoke/bin/pip install --index-url https://pypi.org/simple "${WHEEL}[dashboard,mcp]"
          cd /tmp
          /tmp/testpypi-smoke/bin/python "$GITHUB_WORKSPACE/release-evidence/smoke_wheel.py" --expected-version "$VERSION" --output "$GITHUB_WORKSPACE/release-evidence/testpypi-smoke.json"
          for i in $(seq 1 30); do
            if curl -fsS "https://test.pypi.org/pypi/retrieval-observatory/${VERSION}/json" > "$GITHUB_WORKSPACE/release-evidence/testpypi-metadata.json"; then
              break
            fi
            echo "TestPyPI JSON not ready yet (attempt $i/30); sleeping 10s"
            sleep 10
          done
          test -s "$GITHUB_WORKSPACE/release-evidence/testpypi-metadata.json"
          /tmp/testpypi-smoke/bin/python -c "import json; assert json.load(open('$GITHUB_WORKSPACE/release-evidence/testpypi-metadata.json'))['info']['version'] == '$VERSION'"

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: release-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tested release digest and PyPI trusted publisher package name
        run: |
          python release-evidence/verify_release_artifact.py --dist dist --manifest release-evidence/artifact-manifest.json
          WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          PACKAGE=$(python -c "import email, zipfile; z=zipfile.ZipFile('${WHEEL}'); m=[n for n in z.namelist() if n.endswith('.dist-info/METADATA')][0]; print(email.message_from_bytes(z.read(m))['Name'])")
          test "$PACKAGE" = "retrieval-observatory"
      - name: Stage PyPI packages only
        run: |
          mkdir -p packages
          cp dist/*.whl dist/*.tar.gz packages/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/
          # Idempotent re-runs after a successful upload + failed post-verify (JSON API lag).
          skip-existing: true
      - name: Verify published PyPI metadata matches tested digests
        run: |
          WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          VERSION=$(python -c "import email, zipfile; z=zipfile.ZipFile('${WHEEL}'); m=[n for n in z.namelist() if n.endswith('.dist-info/METADATA')][0]; print(email.message_from_bytes(z.read(m))['Version'])")
          # PyPI's JSON API can 404 briefly after a successful upload; wait for propagation.
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/retrieval-observatory/${VERSION}/json" > release-evidence/pypi-metadata.json; then
              break
            fi
            echo "PyPI JSON not ready yet (attempt $i/30); sleeping 10s"
            sleep 10
          done
          test -s release-evidence/pypi-metadata.json
          python - <<'PY'
          import json
          from pathlib import Path

          expected = json.loads(Path("release-evidence/artifact-manifest.json").read_text(encoding="utf-8"))["sha256"]
          metadata = json.loads(Path("release-evidence/pypi-metadata.json").read_text(encoding="utf-8"))
          actual = {item["filename"]: item["digests"]["sha256"] for item in metadata["urls"]}
          missing = {name: digest for name, digest in expected.items() if actual.get(name) != digest}
          if missing:
              raise SystemExit(f"PyPI digest mismatch: {missing}; published={actual}")
          print("Published PyPI wheel and sdist match tested SHA-256 digests.")
          PY
