name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches pyproject version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match pyproject.toml version $VERSION"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build dashboard UI
        run: make dashboard-build

      - name: Remove bytecode caches
        run: find retrieval_observatory -type d -name __pycache__ -print0 | xargs -0 rm -rf

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Verify wheel contains UI and examples
        run: |
          python -m zipfile -l dist/*.whl | grep -F 'retrieval_observatory/dashboard/ui/dist/index.html'
          python -m zipfile -l dist/*.whl | grep -F 'retrieval_observatory/examples/quickstart_scifact.yaml'

      - name: Check metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

      - name: Smoke install from TestPyPI
        run: |
          VERSION=$(curl -s https://test.pypi.org/pypi/retrieval-observatory/json | python -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
          python -m venv /tmp/testpypi-smoke
          /tmp/testpypi-smoke/bin/pip install --upgrade pip
          # PyPI first for dependencies; TestPyPI only for retrieval-observatory (TestPyPI has typosquat packages like FASTAPI-1.0).
          /tmp/testpypi-smoke/bin/pip install \
            --index-url https://pypi.org/simple/ \
            --extra-index-url https://test.pypi.org/simple/ \
            "retrieval-observatory[dashboard]==${VERSION}"
          /tmp/testpypi-smoke/bin/python -c "from retrieval_observatory import EXAMPLES_DIR; assert (EXAMPLES_DIR / 'quickstart_scifact.yaml').is_file()"
          /tmp/testpypi-smoke/bin/retobs --help

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
