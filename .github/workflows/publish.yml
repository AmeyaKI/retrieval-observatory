name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches pyproject version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match pyproject.toml version $VERSION"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build dashboard UI
        run: make dashboard-build

      - name: Remove bytecode caches
        run: find retrieval_observatory -type d -name __pycache__ -print0 | xargs -0 rm -rf

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Verify wheel contains UI and examples
        run: |
          python -m zipfile -l dist/*.whl | grep -F 'retrieval_observatory/dashboard/ui/dist/index.html'
          python -m zipfile -l dist/*.whl | grep -F 'retrieval_observatory/examples/quickstart_scifact.yaml'

      - name: Check metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Verify wheel name matches TestPyPI trusted publisher
        run: |
          WHEEL=$(ls dist/retobs-*.whl)
          PKG=$(python -c "import zipfile, email; z=zipfile.ZipFile('${WHEEL}'); m=[n for n in z.namelist() if n.endswith('.dist-info/METADATA')][0]; print(email.message_from_string(z.read(m).decode())['Name'])")
          echo "Publishing package: $PKG"
          if [ "$PKG" != "retobs" ]; then
            echo "Expected package name 'retobs' but wheel metadata says '$PKG'"
            exit 1
          fi
          echo "::notice title=Trusted publisher config::TestPyPI publisher project name must be 'retobs' (owner AmeyaKI, repo retrieval-observatory, workflow publish.yml, environment testpypi). See docs/PYPI_PUBLISH.md"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

      - name: Verify package appears on TestPyPI
        run: |
          WHEEL=$(ls dist/retobs-*.whl)
          VERSION=$(basename "$WHEEL" | sed -n 's/retobs-\([^-]*\)-.*/\1/p')
          echo "Expecting retobs ${VERSION} on TestPyPI"
          curl -sf "https://test.pypi.org/pypi/retobs/${VERSION}/json" > /dev/null

      - name: Smoke install built wheel
        run: |
          WHEEL=$(ls dist/retobs-*.whl)
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          # Do NOT pip install extras from TestPyPI — it hosts typosquats (e.g. fastapi==1.0)
          # that satisfy our version constraints. Install the exact uploaded wheel + deps from PyPI.
          /tmp/smoke/bin/pip install \
            --index-url https://pypi.org/simple/ \
            --only-binary=:all: \
            "${WHEEL}[dashboard]"
          /tmp/smoke/bin/python -c "from retrieval_observatory import EXAMPLES_DIR; assert (EXAMPLES_DIR / 'quickstart_scifact.yaml').is_file()"
          UI_INDEX=$(/tmp/smoke/bin/python -c "from retrieval_observatory import PACKAGE_DIR; print(PACKAGE_DIR / 'dashboard/ui/dist/index.html')")
          test -f "$UI_INDEX"
          /tmp/smoke/bin/retobs --help

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Verify wheel name matches PyPI trusted publisher
        run: |
          WHEEL=$(ls dist/retobs-*.whl)
          PKG=$(python -c "import zipfile, email; z=zipfile.ZipFile('${WHEEL}'); m=[n for n in z.namelist() if n.endswith('.dist-info/METADATA')][0]; print(email.message_from_string(z.read(m).decode())['Name'])")
          echo "Publishing package: $PKG"
          if [ "$PKG" != "retobs" ]; then
            echo "Expected package name 'retobs' but wheel metadata says '$PKG'"
            exit 1
          fi
          echo "::notice title=Trusted publisher config::PyPI publisher project name must be 'retobs' (owner AmeyaKI, repo retrieval-observatory, workflow publish.yml, environment pypi). See docs/PYPI_PUBLISH.md"

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Verify package on PyPI
        run: |
          WHEEL=$(ls dist/retobs-*.whl)
          VERSION=$(basename "$WHEEL" | sed -n 's/retobs-\([^-]*\)-.*/\1/p')
          curl -sf "https://pypi.org/pypi/retobs/${VERSION}/json" > /dev/null
