name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -e ".[dev,dashboard,demo,dense,mcp]"

      - name: Build dashboard UI
        run: make dashboard-build

      - name: Dashboard UI tests (vitest)
        run: make dashboard-test

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short -m "not slow"

      - name: Hybrid graph smoke (slow)
        run: pytest tests/integration/test_hybrid_graph_smoke.py -v --tb=short

      - name: Check imports
        run: |
          python -c "import retrieval_observatory as ro; from retrieval_observatory import Query, Document, benchmark"
          python -c "from retrieval_observatory.tracing.integrations.langchain import RetobsLangChainCallback"
          python -c "from retrieval_observatory.cli import app"
          python -c "from retrieval_observatory import run_from_config; from retrieval_observatory.mcp.server import build_server; build_server()"

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: retobs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Postgres DSN
        env:
          # secrets/vars are allowed in step env (not in job-level if:). Prefer
          # external DSN when configured; otherwise use the service container.
          OVERRIDE_SECRET: ${{ secrets.RETOBS_POSTGRES_DSN }}
          OVERRIDE_VAR: ${{ vars.RETOBS_POSTGRES_DSN }}
        run: |
          if [ -n "$OVERRIDE_SECRET" ]; then
            echo "RETOBS_POSTGRES_DSN=$OVERRIDE_SECRET" >> "$GITHUB_ENV"
          elif [ -n "$OVERRIDE_VAR" ]; then
            echo "RETOBS_POSTGRES_DSN=$OVERRIDE_VAR" >> "$GITHUB_ENV"
          else
            echo "RETOBS_POSTGRES_DSN=postgresql://postgres:postgres@localhost:5432/retobs_test" >> "$GITHUB_ENV"
          fi

      - name: Install
        run: pip install -e ".[dev,postgres]"

      - name: Postgres integration tests
        run: pytest tests/unit/test_store_postgres.py -v --tb=short
