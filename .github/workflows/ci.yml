name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  source-gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -e ".[dev,dashboard,demo,dense,mcp]"

      - name: Install dashboard dependencies from lockfile
        run: npm ci --prefix retrieval_observatory/dashboard/ui

      - name: Ruff
        run: ruff check retrieval_observatory tests scripts

      - name: Public surface contract
        run: python scripts/check_public_surface.py

      - name: Removed vocabulary
        run: python scripts/check_public_vocabulary.py

      - name: Markdown links and anchors
        run: python scripts/check_markdown_links.py

      - name: Run unit tests
        run: pytest tests/unit tests/contracts -v --tb=short

      - name: Run integration tests
        run: pytest tests/integration -v --tb=short -m "not slow"

      - name: Dashboard UI tests (vitest)
        run: npm run test --prefix retrieval_observatory/dashboard/ui -- --run

      - name: Build dashboard UI
        run: npm run build --prefix retrieval_observatory/dashboard/ui

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: retobs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Postgres DSN
        env:
          # secrets/vars are allowed in step env (not in job-level if:). Prefer
          # external DSN when configured; otherwise use the service container.
          OVERRIDE_SECRET: ${{ secrets.RETOBS_POSTGRES_DSN }}
          OVERRIDE_VAR: ${{ vars.RETOBS_POSTGRES_DSN }}
        run: |
          if [ -n "$OVERRIDE_SECRET" ]; then
            echo "RETOBS_POSTGRES_DSN=$OVERRIDE_SECRET" >> "$GITHUB_ENV"
          elif [ -n "$OVERRIDE_VAR" ]; then
            echo "RETOBS_POSTGRES_DSN=$OVERRIDE_VAR" >> "$GITHUB_ENV"
          else
            echo "RETOBS_POSTGRES_DSN=postgresql://postgres:postgres@localhost:5432/retobs_test" >> "$GITHUB_ENV"
          fi

      - name: Install
        run: pip install -e ".[dev,postgres]"

      - name: Postgres integration tests
        run: pytest tests/unit/test_store_postgres.py -v --tb=short

  dashboard-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: retrieval_observatory/dashboard/ui/package-lock.json
      - name: Install
        run: |
          pip install -e ".[dev,dashboard]"
          npm ci --prefix retrieval_observatory/dashboard/ui
          python -m playwright install --with-deps chromium
      - name: Build dashboard and enforce bundle budgets
        run: npm run build --prefix retrieval_observatory/dashboard/ui
      - name: Seed deterministic demo
        run: retobs demo --db .retobs/e2e/results.db --output-dir .retobs/e2e --n-traces 80
      - name: Start dashboard
        run: |
          retobs serve --host 127.0.0.1 --port 4000 --db .retobs/e2e/results.db > /tmp/retobs-dashboard.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4000/dbs && exit 0; sleep 1; done
          cat /tmp/retobs-dashboard.log
          exit 1
      - name: Responsive, state, semantic, and WCAG browser tests
        env:
          RETOBS_E2E_URL: http://127.0.0.1:4000
        run: pytest tests/browser -v --tb=short
