name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev,dashboard]"

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short

      - name: Check imports
        run: |
          python -c "from retrieval_observatory.types import Query, Document, BaseRetriever"
          python -c "from retrieval_observatory.store.sqlite import SQLiteStore"
          python -c "from retrieval_observatory.metrics.engine import MetricsEngine"
          python -c "from retrieval_observatory.cli import app"
