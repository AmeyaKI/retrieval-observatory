name: retrieval-ci

on:
  pull_request:
    branches: [main]

jobs:
  release-candidate:
    uses: ./.github/workflows/release-candidate.yml

  golden-check:
    needs: release-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - run: shasum -a 256 -c dist/SHA256SUMS

      - name: Install tested wheel
        run: |
          python -m venv /tmp/retobs-retrieval-ci
          WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          /tmp/retobs-retrieval-ci/bin/pip install --index-url https://pypi.org/simple "${WHEEL}"

      - name: Generate deterministic demo runs
        run: |
          /tmp/retobs-retrieval-ci/bin/retobs demo --db .retobs/ci/results.db --output-dir .retobs/ci
          BASELINE=$(/tmp/retobs-retrieval-ci/bin/python -c "import json; print(json.load(open('.retobs/ci/demo_manifest.json'))['baseline_run_id'])")
          CANDIDATE=$(/tmp/retobs-retrieval-ci/bin/python -c "import json; print(json.load(open('.retobs/ci/demo_manifest.json'))['validation_run_id'])")
          echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"
          POLICY=$(/tmp/retobs-retrieval-ci/bin/python -c "import json; print(json.load(open('.retobs/ci/demo_manifest.json'))['policy_path'])")
          echo "CANDIDATE=$CANDIDATE" >> "$GITHUB_ENV"
          echo "POLICY=$POLICY" >> "$GITHUB_ENV"
      - name: Compare baseline with validated change
        id: compare
        run: |
          mkdir -p artifacts
          WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          WHEEL_DIGEST=$(shasum -a 256 "$WHEEL" | awk '{print $1}')
          printf 'Wheel SHA-256: `%s`\n\n' "$WHEEL_DIGEST" | tee artifacts/wheel-sha256.md >> "$GITHUB_STEP_SUMMARY"
          set +e
          /tmp/retobs-retrieval-ci/bin/retobs compare "$BASELINE" "$CANDIDATE" --db .retobs/ci/results.db --policy "$POLICY" --artifacts artifacts/release-audit --fail-on hold-or-block-or-fail > artifacts/comparison.md
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat artifacts/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-comparison
          path: artifacts/

      - name: Release gate
        env:
          CODE: ${{ steps.compare.outputs.code }}
        run: |
          case "$CODE" in
            0) echo "release gate: PASS" ;;
            1) echo "release gate: FAIL (see release-audit.html)"; exit 1 ;;
            2) echo "release gate: BLOCK (see release-audit.html)"; exit 1 ;;
            3) echo "release gate: HOLD (see release-audit.html)"; exit 1 ;;
            *) echo "release gate: tool error, no decision (exit ${CODE:-unset})"; exit 1 ;;
          esac
