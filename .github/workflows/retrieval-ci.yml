name: retrieval-ci

on:
  pull_request:
    branches: [main]

jobs:
  golden-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[demo,dashboard,dense,dev]"

      - name: Generate deterministic regression story
        run: |
          retobs demo --db .retobs/ci/results.db --output-dir .retobs/ci --n-traces 30
          echo "BASELINE=$(python -c "import json; print(json.load(open('.retobs/ci/demo_manifest.json'))['baseline_run_id'])")" >> $GITHUB_ENV
          echo "CANDIDATE=$(python -c "import json; print(json.load(open('.retobs/ci/demo_manifest.json'))['validation_run_id'])")" >> $GITHUB_ENV

      - name: Compare baseline with validated change
        run: |
          mkdir -p artifacts
          retobs compare "$BASELINE" "$CANDIDATE" --db .retobs/ci/results.db --format markdown --output artifacts/comparison.md --fail-on regression
          retobs compare "$BASELINE" "$CANDIDATE" --db .retobs/ci/results.db --format html --output artifacts/comparison.html --fail-on regression
          cat artifacts/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reviewable comparison
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-comparison
          path: artifacts/
