schema_version: 3
id: support-search-release
evaluation:
  unit: document
  boundary: final_retrieval
  k: 10
  relevance_threshold: 1
  unjudged_metric_policy: zero_gain
  comparison_scope: fixed_corpus
intervention:
  expected_changes:
    - reranker_model_revision
evidence:
  require_query_input_identity: true
  require_judgment_identity: true
  require_corpus_identity: true
  require_index_encoder_compatibility: false
  require_lineage_for_decision: false
statistics:
  confidence_level: 0.95
  familywise_alpha: 0.05
  resamples: 10000
  seed: 17
  min_pair_coverage: 1.0
metrics:
  - id: final-recall
    metric: recall
    target: final_retrieval
    direction: higher_is_better
    max_regression: 0.01
    min_paired_n: 100
  - id: query-latency
    metric: latency_ms
    target: query
    estimator: p95
    direction: lower_is_better
    max_regression: 50.0
    min_paired_n: 200
slices:
  - id: critical
    field: critical
    value: true
    metric_ids: [final-recall]
execution:
  max_failure_rate: 0.0
