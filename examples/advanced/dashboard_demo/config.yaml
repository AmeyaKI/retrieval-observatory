# Dashboard demo — 3-stage RAG cascade with ablation combinations.
#
# Generates four pipelines from one config:
#   bm25
#   bm25__fast_rerank
#   bm25__precise_rerank
#   bm25__fast_rerank__precise_rerank
#
# Prerequisites:
#   pip install -e ".[demo,hf,dashboard,classifier]"
#   python examples/advanced/dashboard_demo/generate_data.py
#
# Quick run (~5–15 min on CPU depending on cache):
#   retobs run --config examples/advanced/dashboard_demo/config.yaml --latency-budget-ms 3000
#
# Then train a difficulty classifier and re-run once so Query Explorer + Calibration populate:
#   retobs classifier train --dataset observatory-demo --db .retobs/dashboard_demo.db
#   retobs run --config examples/advanced/dashboard_demo/config.yaml --latency-budget-ms 3000
#
# Dashboard:
#   retobs serve --db .retobs/dashboard_demo.db

experiment:
  name: dashboard-demo-3stage

dataset:
  type: custom
  name: observatory-demo
  # Paths are relative to this config file's directory (examples/advanced/dashboard_demo/).
  queries_path: queries.jsonl
  corpus_path: corpus.jsonl

stages:
  bm25:
    type: adapter.bm25
    retriever_id: bm25
    config:
      k: 40
      tokenizer: whitespace

  fast_rerank:
    type: adapter.hf_crossencoder
    retriever_id: fast_rerank
    config:
      model: cross-encoder/ms-marco-MiniLM-L-6-v2
      k: 15
      batch_size: 16

  precise_rerank:
    type: adapter.hf_crossencoder
    retriever_id: precise_rerank
    config:
      model: cross-encoder/ms-marco-MiniLM-L-12-v2
      k: 10
      batch_size: 8

combinations:
  include:
    - [bm25, fast_rerank, precise_rerank]
  ablations: true

costs:
  bm25:
    per_1k_queries: 0.10
  fast_rerank:
    per_1k_queries: 1.50
  precise_rerank:
    per_1k_queries: 4.00

metrics:
  recall_at_k: [1, 5, 10, 20]
  ndcg_at_k: [10]
  mrr: true
  map: true
  latency_percentiles: [50, 95, 99]

execution:
  concurrency: 1
  timeout_seconds: 180
  cache_results: true

output:
  store: sqlite
  db_path: .retobs/dashboard_demo.db
  export: [json]
