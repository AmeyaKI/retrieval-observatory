# Hybrid DAG benchmark — BEIR FiQA (57k docs, 648 test queries)
# Architecture: BM25 + MiniLM fan-in (RRF) → cross-encoder rerank → optional ablation prefix chain
#
# Fast path (smoke): max_queries: 50 (~2 min with dense indexing cached)
# Full eval: remove max_queries or set to 648

experiment:
  name: hybrid-dag-fiqa

dataset:
  name: beir/fiqa
  split: test
  max_queries: 50

stages:
  bm25:
    type: adapter.bm25
    retriever_id: bm25
    config:
      k: 100

  dense:
    type: adapter.hf_biencoder
    retriever_id: dense
    config:
      model: sentence-transformers/all-MiniLM-L6-v2
      k: 100
      batch_size: 64

  hybrid:
    type: adapter.rrf
    retriever_id: hybrid_rrf
    config:
      rrf_k: 60
      fetch_k: 100
      top_k: 100
      retrievers:
        - type: adapter.bm25
          retriever_id: bm25
          config:
            k: 100
        - type: adapter.hf_biencoder
          config:
            model: sentence-transformers/all-MiniLM-L6-v2
            k: 100
            batch_size: 64

  rerank:
    type: adapter.hf_crossencoder
    retriever_id: cross_rerank
    config:
      model: cross-encoder/ms-marco-MiniLM-L-6-v2
      k: 10
      batch_size: 32

pipelines:
  - id: bm25_only
    stages:
      - type: adapter.bm25
        retriever_id: bm25
        config:
          k: 100

  - id: dense_only
    stages:
      - type: adapter.hf_biencoder
        retriever_id: dense
        config:
          model: sentence-transformers/all-MiniLM-L6-v2
          k: 100
          batch_size: 64

combinations:
  include:
    - [hybrid, rerank]
  ablations: true

metrics:
  recall_at_k: [1, 5, 10]
  ndcg_at_k: [10]
  mrr: true
  map: true
  latency_percentiles: [50, 95]

execution:
  concurrency: 1
  timeout_seconds: 300
  cache_results: true

output:
  store: sqlite
  db_path: .retobs/hybrid_fiqa_demo.db
  export: [json]
