name: retrieval-comparison

on:
  pull_request:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install retobs and project
        run: pip install "retrieval-observatory[dashboard]" -e .
      - name: Evaluate candidate
        run: |
          mkdir -p artifacts
          retobs evaluate project_eval.py:retrieve --db .retobs/results.db --format json --output artifacts/candidate.json
          echo "CANDIDATE_RUN=$(python -c \"import json; print(json.load(open('artifacts/candidate.json'))['run_id'])\")" >> "$GITHUB_ENV"
      - name: Compare with repository baseline
        env:
          BASELINE_RUN: ${{ vars.RETOBS_BASELINE_RUN }}
        run: |
          retobs compare "$BASELINE_RUN" "$CANDIDATE_RUN" --db .retobs/results.db --policy examples/ci/release-policy.yaml --format markdown --output artifacts/retobs-comparison.md --fail-on hold-or-block-or-fail
          retobs compare "$BASELINE_RUN" "$CANDIDATE_RUN" --db .retobs/results.db --policy examples/ci/release-policy.yaml --format html --output artifacts/retobs-comparison.html
          cat artifacts/retobs-comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: retobs-comparison
          path: artifacts/
          if-no-files-found: error
