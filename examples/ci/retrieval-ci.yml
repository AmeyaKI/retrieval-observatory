name: retrieval-comparison

on:
  pull_request:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install retobs and project
        run: pip install "retrieval-observatory[dashboard]" -e .
      - name: Evaluate candidate
        run: |
          mkdir -p artifacts
          retobs evaluate project_eval.py:retrieve --db .retobs/results.db --format json --output artifacts/candidate.json
          echo "CANDIDATE_RUN=$(python -c \"import json; print(json.load(open('artifacts/candidate.json'))['run_id'])\")" >> "$GITHUB_ENV"
      - name: Compare with repository baseline
        env:
          BASELINE_RUN: ${{ vars.RETOBS_BASELINE_RUN }}
        run: |
          set +e
          retobs compare "$BASELINE_RUN" "$CANDIDATE_RUN" --db .retobs/results.db --policy examples/ci/release-policy-v3.yaml --artifacts artifacts/release-audit --fail-on hold-or-block-or-fail
          echo "code=$?" >> "$GITHUB_OUTPUT"
        id: audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retobs-release-audit
          path: artifacts/
          if-no-files-found: error
      - name: Release gate
        run: |
          # Exit codes: 0 PASS, 1 FAIL, 2 BLOCK, 3 HOLD (a decision was written); anything else is a tool error.
          case "${{ steps.audit.outputs.code }}" in
            0) echo "release gate: PASS" ;;
            1|2|3) echo "release gate: non-PASS decision (see artifacts/release-audit/release-audit.html)"; exit 1 ;;
            *) echo "release gate: tool error, no decision"; exit 1 ;;
          esac
